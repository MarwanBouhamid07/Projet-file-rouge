<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMatch Admin - Tableau de bord</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4">
            <a href="dashboard.html" class="flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-sm font-bold text-white">SM</span>
                <span class="font-bold">SmartMatch Admin</span>
            </a>
            <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="rounded-lg bg-indigo-600 px-4 py-2 text-white">Dashboard</a>
                <a href="offres.html" class="rounded-lg border border-slate-200 px-4 py-2 text-slate-600 hover:bg-slate-100">Offres</a>
                <a href="competences.html" class="rounded-lg border border-slate-200 px-4 py-2 text-slate-600 hover:bg-slate-100">Competences</a>
                <button type="button" data-logout class="rounded-lg border border-red-200 px-4 py-2 text-red-600 hover:bg-red-50">Deconnexion</button>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-10">
        <h1 class="text-3xl font-bold">Tableau de bord</h1>
        <p class="mt-2 text-slate-500">Vue temps reel chargee depuis api.php (fetch, sans rechargement).</p>
        <div class="mt-8 grid gap-6 md:grid-cols-3">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <p class="text-sm font-semibold text-slate-500">Offres publiees</p>
                <p id="statOffres" class="mt-2 text-4xl font-bold text-indigo-700">-</p>
                <a href="offres.html" class="mt-4 inline-block text-sm font-semibold text-indigo-600">Gerer les offres &rarr;</a>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <p class="text-sm font-semibold text-slate-500">Competences</p>
                <p id="statCompetences" class="mt-2 text-4xl font-bold text-sky-700">-</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <p class="text-sm font-semibold text-slate-500">Utilisateurs</p>
                <p id="statUsers" class="mt-2 text-4xl font-bold text-emerald-700">-</p>
            </div>
        </div>
        <div class="mt-8 grid gap-6 lg:grid-cols-2">
            <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="font-bold">Dernieres offres</h2>
                <ul id="recentOffres" class="mt-4 space-y-3 text-sm text-slate-600"><li>Chargement...</li></ul>
            </section>
            <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="font-bold">Dernieres competences</h2>
                <ul id="recentCompetences" class="mt-4 space-y-3 text-sm text-slate-600"><li>Chargement...</li></ul>
            </section>
        </div>
        <p id="dashboardError" class="mt-6 hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>
    </main>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script>
        (function () {
            'use strict';
            document.addEventListener('DOMContentLoaded', async function () {
                var ok = await SmartMatchAuth.requireAdmin();
                if (!ok) { return; }
                var r = await Promise.all([
                    SmartMatch.api.list('offres'),
                    SmartMatch.api.list('competences'),
                    SmartMatch.api.list('users')
                ]);
                var offres = r[0].ok ? r[0].payload.data : [];
                var comps = r[1].ok ? r[1].payload.data : [];
                var users = r[2].ok ? r[2].payload.data : [];
                document.getElementById('statOffres').textContent = offres.length;
                document.getElementById('statCompetences').textContent = comps.length;
                document.getElementById('statUsers').textContent = users.length;
                document.getElementById('recentOffres').innerHTML = offres.slice(0, 5).map(function (o) {
                    return '<li class="rounded-xl bg-slate-50 px-4 py-2"><b>' + SmartMatch.escapeHtml(o.titre) +
                        '</b> <span class="text-slate-400">' + SmartMatch.escapeHtml(o.domaine || '') + '</span></li>';
                }).join('') || '<li>Aucune offre.</li>';
                document.getElementById('recentCompetences').innerHTML = comps.slice(0, 8).map(function (c) {
                    return '<li class="inline-block rounded-full bg-sky-50 px-3 py-1 text-xs font-semibold text-sky-700">' +
                        SmartMatch.escapeHtml(c.nom) + '</li>';
                }).join(' ') || '<li>Aucune competence.</li>';
                if (!r[0].ok || !r[1].ok) {
                    var box = document.getElementById('dashboardError');
                    box.textContent = 'Certaines donnees ont echoue a charger.';
                    box.classList.remove('hidden');
                }
            });
        })();
    </script>

</body>
</html>
