<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMatch Admin - Competences</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4">
            <a href="dashboard.html" class="flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-sm font-bold text-white">SM</span>
                <span class="font-bold">SmartMatch Admin</span>
            </a>
            <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="rounded-lg border border-slate-200 px-4 py-2 text-slate-600 hover:bg-slate-100">Dashboard</a>
                <a href="offres.html" class="rounded-lg border border-slate-200 px-4 py-2 text-slate-600 hover:bg-slate-100">Offres</a>
                <a href="competences.html" class="rounded-lg bg-sky-600 px-4 py-2 text-white">Competences</a>
                <button type="button" data-logout class="rounded-lg border border-red-200 px-4 py-2 text-red-600 hover:bg-red-50">Deconnexion</button>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-4xl px-4 py-10">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold">Competences (<span id="competencesCount">-</span>)</h1>
                <p class="mt-1 text-slate-500">Catalogue gere via api.php, noms uniques insensibles a la casse.</p>
            </div>
            <button id="openCreateBtn" type="button" class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-bold text-white hover:bg-sky-500">+ Ajouter une competence</button>
        </div>
        <div class="mt-6 overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
            <table class="w-full min-w-[520px] text-left text-sm">
                <thead class="bg-slate-50 text-xs uppercase text-slate-500">
                    <tr><th class="px-4 py-3">ID</th><th class="px-4 py-3">Nom</th><th class="px-4 py-3 text-right">Actions</th></tr>
                </thead>
                <tbody id="competencesTableBody"><tr><td colspan="3" class="px-4 py-10 text-center text-slate-400">Chargement...</td></tr></tbody>
            </table>
        </div>
    </main>
    <div id="modalCompetence" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4">
        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
            <div class="flex items-center justify-between">
                <h2 id="modalTitle" class="text-xl font-bold">Ajouter une competence</h2>
                <button id="closeModalBtn" type="button" class="rounded-lg border px-3 py-1 text-slate-500 hover:bg-slate-100">X</button>
            </div>
            <ul id="formErrors" class="mt-4 hidden list-disc space-y-1 rounded-xl bg-red-50 px-4 py-3 pl-8 text-sm text-red-700"></ul>
            <form id="competenceForm" class="mt-4 space-y-4">
                <div><label class="text-sm font-semibold" for="nom">Nom * (max 80 caracteres)</label><input id="nom" name="nom" maxlength="80" required class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"></div>
                <div class="flex justify-end gap-2"><button id="cancelModalBtn" type="button" class="rounded-xl border px-5 py-2.5 text-sm font-semibold">Annuler</button><button id="submitBtn" type="submit" class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-bold text-white">Enregistrer</button></div>
            </form>
        </div>
    </div>
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden rounded-xl px-5 py-3 text-sm font-semibold text-white shadow-lg"></div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script src="../assets/js/admin-competences.js"></script>
</body>
</html>
