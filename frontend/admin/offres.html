<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMatch Admin - Offres</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4">
            <a href="dashboard.html" class="flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-sm font-bold text-white">SM</span>
                <span class="font-bold">SmartMatch Admin</span>
            </a>
            <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="rounded-lg border border-slate-200 px-4 py-2 text-slate-600 hover:bg-slate-100">Dashboard</a>
                <a href="offres.html" class="rounded-lg bg-indigo-600 px-4 py-2 text-white">Offres</a>
                <a href="competences.html" class="rounded-lg border border-slate-200 px-4 py-2 text-slate-600 hover:bg-slate-100">Competences</a>
                <button type="button" data-logout class="rounded-lg border border-red-200 px-4 py-2 text-red-600 hover:bg-red-50">Deconnexion</button>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-10">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold">Offres (<span id="offresCount">-</span>)</h1>
                <p class="mt-1 text-slate-500">CRUD complet via api.php, sans rechargement de page.</p>
            </div>
            <button id="openCreateBtn" type="button" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white hover:bg-indigo-500">+ Ajouter une offre</button>
        </div>
        <div class="mt-6 overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
            <table class="w-full min-w-[820px] text-left text-sm">
                <thead class="bg-slate-50 text-xs uppercase text-slate-500">
                    <tr><th class="px-4 py-3">Image</th><th class="px-4 py-3">Titre</th><th class="px-4 py-3">Domaine</th><th class="px-4 py-3">Exp.</th><th class="px-4 py-3">Recruteur</th><th class="px-4 py-3">Cree le</th><th class="px-4 py-3 text-right">Actions</th></tr>
                </thead>
                <tbody id="offresTableBody"><tr><td colspan="7" class="px-4 py-10 text-center text-slate-400">Chargement...</td></tr></tbody>
            </table>
        </div>
    </main>
    <div id="modalOffre" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4">
        <div class="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-2xl">
            <div class="flex items-center justify-between">
                <h2 id="modalTitle" class="text-xl font-bold">Ajouter une offre</h2>
                <button id="closeModalBtn" type="button" class="rounded-lg border px-3 py-1 text-slate-500 hover:bg-slate-100">X</button>
            </div>
            <ul id="formErrors" class="mt-4 hidden list-disc space-y-1 rounded-xl bg-red-50 px-4 py-3 pl-8 text-sm text-red-700"></ul>
            <form id="offreForm" class="mt-4 grid gap-4 md:grid-cols-2" enctype="multipart/form-data">
                <div class="md:col-span-2"><label class="text-sm font-semibold" for="titre">Titre *</label><input id="titre" name="titre" maxlength="150" required class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"></div>
                <div class="md:col-span-2"><label class="text-sm font-semibold" for="description">Description</label><textarea id="description" name="description" rows="3" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"></textarea></div>
                <div><label class="text-sm font-semibold" for="domaine">Domaine *</label><input id="domaine" name="domaine" maxlength="100" required class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"></div>
                <div><label class="text-sm font-semibold" for="years_required">Annees requises *</label><input id="years_required" name="years_required" type="number" min="0" step="1" value="0" required class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"></div>
                <div><label class="text-sm font-semibold" for="id_recruteur">Recruteur *</label><select id="id_recruteur" name="id_recruteur" required class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm"><option value="">Chargement...</option></select></div>
                <div><label class="text-sm font-semibold" for="image">Image (jpg/png/webp, 2 Mo max)</label><input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.webp" class="mt-1 w-full text-sm"><p id="imageRequiredHint" class="mt-1 text-xs text-slate-400">Obligatoire a la creation, optionnelle en modification.</p><div id="imagePreviewWrap" class="mt-2 hidden"><img id="imagePreview" alt="Apercu" class="h-24 w-32 rounded-lg object-cover"></div></div>
                <div class="flex justify-end gap-2 md:col-span-2"><button id="cancelModalBtn" type="button" class="rounded-xl border px-5 py-2.5 text-sm font-semibold">Annuler</button><button id="submitBtn" type="submit" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white">Enregistrer</button></div>
            </form>
        </div>
    </div>
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden rounded-xl px-5 py-3 text-sm font-semibold text-white shadow-lg"></div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script src="../assets/js/admin-offres.js"></script>
</body>
</html>
