<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMatch Admin - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-indigo-700 via-indigo-600 to-slate-900 p-4">
    <main class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">
        <div class="flex items-center gap-3">
            <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-indigo-600 text-sm font-bold text-white">SM</span>
            <div>
                <h1 class="text-xl font-bold">SmartMatch Admin</h1>
                <p class="text-sm text-slate-500">Connectez-vous pour gerer offres et competences</p>
            </div>
        </div>

        <div id="alreadyBox" class="mt-4 hidden rounded-xl bg-emerald-50 px-4 py-3 text-sm text-emerald-700">Session active, redirection...</div>
        <ul id="loginErrors" class="mt-4 hidden list-disc space-y-1 rounded-xl bg-red-50 px-4 py-3 pl-8 text-sm text-red-700"></ul>

        <form id="loginForm" class="mt-6 space-y-4" novalidate>
            <div>
                <label for="email" class="text-sm font-semibold">Email administrateur</label>
                <input id="email" name="email" type="email" required autocomplete="username"
                    placeholder="admin@jobmatch.local"
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>
            <div>
                <label for="password" class="text-sm font-semibold">Mot de passe</label>
                <input id="password" name="password" type="password" required autocomplete="current-password"
                    placeholder="••••••••"
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>
            <button id="loginBtn" type="submit"
                class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-indigo-500 disabled:opacity-60">Se connecter</button>
        </form>

        <div class="mt-6 rounded-2xl bg-slate-50 p-4 text-xs text-slate-500">
            <p class="font-semibold text-slate-700">Compte de demonstration :</p>
            <p class="mt-1">Email : <code class="rounded bg-white px-1">admin@jobmatch.local</code></p>
            <p>Mot de passe : <code class="rounded bg-white px-1">admin123</code></p>
        </div>

        <a href="../index.html" class="mt-4 inline-block text-sm font-semibold text-indigo-600 hover:text-indigo-500">&larr; Retour au site public</a>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script>
        (function () {
            'use strict';
            document.addEventListener('DOMContentLoaded', async function () {
                var already = await SmartMatchAuth.redirectIfAuthenticated();
                if (already) {
                    document.getElementById('alreadyBox').classList.remove('hidden');
                    return;
                }

                var form = document.getElementById('loginForm');
                form.addEventListener('submit', async function (event) {
                    event.preventDefault();
                    var box = document.getElementById('loginErrors');
                    var button = document.getElementById('loginBtn');
                    box.innerHTML = '';
                    box.classList.add('hidden');
                    button.disabled = true;

                    var email = document.getElementById('email').value.trim();
                    var password = document.getElementById('password').value;
                    var result = await SmartMatch.api.login(email, password);
                    button.disabled = false;

                    if (!result.ok) {
                        box.innerHTML = SmartMatch.errorMessages(result)
                            .map(function (m) { return '<li>' + SmartMatch.escapeHtml(m) + '</li>'; }).join('');
                        box.classList.remove('hidden');
                        return;
                    }
                    window.location.replace('dashboard.html');
                });
            });
        })();
    </script>
</body>
</html>
